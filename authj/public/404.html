<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Novex</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .container { text-align: center; position: relative; }
    .glitch {
      font-size: 180px;
      font-weight: 900;
      letter-spacing: 15px;
      color: #fff;
      text-shadow: 0 0 10px rgba(255,255,255,0.5), 0 0 40px rgba(255,255,255,0.2);
      animation: glitch 1s infinite;
    }
    @keyframes glitch {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(-3px, 3px); }
      40% { transform: translate(-3px, -3px); }
      60% { transform: translate(3px, 3px); }
      80% { transform: translate(3px, -3px); }
    }
    .sub { font-size: 18px; color: #888; margin-top: -10px; letter-spacing: 3px; }
    .ip-info {
      margin-top: 30px;
      padding: 15px 25px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      font-size: 13px;
      color: #555;
      letter-spacing: 1px;
      transition: all 0.3s;
    }
    .ip-info:hover { border-color: rgba(255,255,255,0.3); color: #aaa; }
    .home-link { margin-top: 25px; display: inline-block; color: #444; text-decoration: none; font-size: 14px; transition: 0.3s; }
    .home-link:hover { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
  </style>
</head>
<body>
  <div class="container">
    <div class="glitch">404</div>
    <div class="sub">SAYFA BULUNAMADI</div>
    <div class="ip-info" id="ipInfo">IP adresiniz kaydediliyor...</div>
    <a href="/" class="home-link">Ana Sayfaya Don</a>
  </div>
  <script>
    fetch('/api/myip').then(r => r.json()).then(d => {
      document.getElementById('ipInfo').textContent = `IP: ${d.ip} | Bu giris kayit altina alindi.`;
    });
  </script>
</body>
</html>
